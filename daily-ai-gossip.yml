name: Daily AI Morning Gossip

on:
  schedule:
    # 01:30 UTC = 07:00 AM IST, every day.
    # GitHub Actions cron uses UTC — adjust if you want a different local time.
    - cron: "30 1 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python ai_gossip_digest.py
